<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VELNAR Platform | Enterprise Revenue Intelligence</title>
    <meta name="description" content="Executive revenue leak detection, business twin modeling, and verified growth orchestration for modern B2B enterprises." />
    
    <!-- Inline anti-flash theme bootstrap -->
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('velnar_theme_preference') || 'dark';
          var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e){}
      })();
    </script>

    <!-- Google Fonts for Financial Terminal & Editorial Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="theme-root antialiased selection:bg-[#C5A880]/30 selection:text-[#FFF]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
