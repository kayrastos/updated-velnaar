[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kayra-ai"
version = "0.1.0"
description = "Kayra AI modelden bağımsız yerel çalışma zamanı ve değerlendirme altyapısı"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3",
  "PyYAML>=6,<7",
]

[project.scripts]
kayra-validate = "kayra_ai.validation.validate_dataset:main"
kayra-check-pii = "kayra_ai.validation.check_pii:main"
kayra-check-overlap = "kayra_ai.validation.check_overlap:main"
kayra-runtime-preflight = "kayra_ai.runtime.preflight:main"
kayra-eval = "kayra_ai.evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
